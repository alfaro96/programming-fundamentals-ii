# Publishes the slides: the web version, plus two PDFs per unit, one with a
# page per step as shown in class and one with every step on a single page
# for students to print
name: Publish slides

on:
  # On every push to main
  push:
    branches: [main]
  # By hand
  workflow_dispatch:

permissions:
  contents: read # Check out the repository to build the slides
  pages: write # Publish the result
  id-token: write # Prove that this workflow is the one publishing

# Only one publication at a time: a new push cancels the one still running,
# so the latest version is always the one that ends up online
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Generates the web version, the PDFs and the index page
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sh scripts/site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slides/production/site

  # Puts what build generated online
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
