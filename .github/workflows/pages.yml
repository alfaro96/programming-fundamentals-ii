# Publishes the slides of every unit, the statements of its exercises and assignments, and an index page
# that links them
name: Publish slides

on:
  # On every push to main
  push:
    branches: [main]
  # By hand
  workflow_dispatch:

permissions:
  contents: read  # Check out the repository to build the slides
  pages: write  # Publish the result
  id-token: write  # Prove that this workflow is the one publishing

# Only one publication at a time: a new push cancels the one still running
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Builds the slides and the index page
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@v7
      # Made here, since the image writes as root: the index page then has to write into it
      - run: mkdir -p production/web
      # The class and print slides of every unit, and the statements of its exercises and assignments, in TeX
      # Live's image: latexmk, XeLaTeX and every package
      - uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          run: cd slides && sh scripts/beamer.sh && sh scripts/statements.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The index page, with a button for each kind of slide and a link for each statement
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: slides/production/web

  # Puts what build generated online
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
