# Publishes the web version of the slides
name: Publish slides

on:
  # On every push to main
  push:
    branches: [main]
  # By hand
  workflow_dispatch:

permissions:
  contents: read  # Check out the repository to build the slides
  pages: write  # Publish the result
  id-token: write  # Prove that this workflow is the one publishing

# Only one publication at a time: a new push cancels the one still running
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Builds the web version of the slides
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: slides/production/web

  # Puts what build generated online
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
